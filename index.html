<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151a23">
<title>Générateur de fugues</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
<script src="fugue-lib.js"></script>
<style>
  :root {
    --ink: #151a23;
    --ink-soft: #1e2530;
    --parchment: #ece4d3;
    --parchment-dim: #b9b0a0;
    --brass: #c9a35f;
    --brass-dim: #8a7548;
    --line: #333d4d;
    --danger: #c97a5f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--ink);
    color: var(--parchment);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  }
  body { padding: 0 0 4rem; }

  header {
    padding: 2.5rem 1.5rem 1.5rem;
    max-width: 880px;
    margin: 0 auto;
  }
  header h1 {
    font-size: 1.9rem;
    font-weight: 500;
    margin: 0 0 0.35rem;
    letter-spacing: 0.01em;
  }
  header p {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    color: var(--parchment-dim);
    margin: 0;
    font-size: 0.95rem;
    max-width: 60ch;
    line-height: 1.5;
  }

  main { max-width: 880px; margin: 0 auto; padding: 0 1.5rem; }

  .panel {
    background: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1.5rem;
    font-family: -apple-system, 'Segoe UI', sans-serif;
  }

  .field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1rem 1.25rem;
  }
  .field label {
    display: block;
    font-size: 0.8rem;
    color: var(--parchment-dim);
    margin-bottom: 0.35rem;
  }
  .field select, .field input[type=number] {
    width: 100%;
    background: var(--ink);
    border: 1px solid var(--line);
    color: var(--parchment);
    border-radius: 3px;
    padding: 0.5rem 0.6rem;
    font-size: 0.95rem;
    font-family: inherit;
  }
  .field select:focus, .field input:focus {
    outline: 2px solid var(--brass);
    outline-offset: 1px;
  }

  .toggles {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem 1.4rem;
    margin-top: 1.25rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--line);
  }
  .toggles label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.9rem;
    color: var(--parchment);
    cursor: pointer;
  }
  .toggles input { accent-color: var(--brass); width: 16px; height: 16px; }

  .actions {
    margin-top: 1.4rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  button.primary {
    background: var(--brass);
    color: var(--ink);
    border: none;
    border-radius: 3px;
    padding: 0.65rem 1.4rem;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  button.primary:hover { background: #d9b571; }
  button.primary:disabled { background: var(--brass-dim); cursor: wait; }
  button.secondary {
    background: transparent;
    color: var(--parchment);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0.6rem 1.1rem;
    font-size: 0.9rem;
    font-family: inherit;
    cursor: pointer;
  }
  button.secondary:hover { border-color: var(--brass-dim); }
  button.secondary:disabled { opacity: 0.4; cursor: not-allowed; }

  #status {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.88rem;
    color: var(--parchment-dim);
    min-height: 1.4em;
  }
  #status.error { color: var(--danger); }

  #result {
    margin-top: 2rem;
  }
  #structure {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.88rem;
    color: var(--parchment-dim);
    margin-bottom: 1rem;
    line-height: 1.7;
  }
  #structure b { color: var(--parchment); font-weight: 600; }
  .voice-label {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--parchment-dim);
    margin: 0.3rem 0 0.1rem 0.2rem;
  }
  #score-wrap {
    overflow-x: auto;
    background: var(--parchment);
    border-radius: 4px;
    padding: 14px 8px;
  }

  footer {
    max-width: 880px;
    margin: 2.5rem auto 0;
    padding: 0 1.5rem;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--parchment-dim);
  }
</style>
</head>
<body>

<header>
  <h1>Générateur de fugues</h1>
  <p>Génère à la volée des fugues respectant les règles académiques du contrepoint : sujet, réponse, contre-sujet, exposition, divertissement, rentrée, pédale, strette et cadence.</p>
</header>

<main>
  <section class="panel">
    <div class="field-grid">
      <div class="field">
        <label for="tonic">Tonique</label>
        <select id="tonic">
          <option>C</option><option>C#</option><option>D</option><option>Eb</option>
          <option>E</option><option>F</option><option>F#</option><option>G</option>
          <option>Ab</option><option>A</option><option>Bb</option><option>B</option>
        </select>
      </div>
      <div class="field">
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="major">Majeur</option>
          <option value="minor">Mineur</option>
        </select>
      </div>
      <div class="field">
        <label for="voices">Voix</label>
        <select id="voices">
          <option value="2">2 voix</option>
          <option value="3" selected>3 voix</option>
        </select>
      </div>
      <div class="field">
        <label for="subjectBeats">Longueur du sujet (temps)</label>
        <select id="subjectBeats">
          <option value="4">4</option>
          <option value="6" selected>6</option>
          <option value="8">8</option>
        </select>
      </div>
    </div>

    <div class="toggles">
      <label><input type="checkbox" id="opt-development" checked> Divertissement + rentrée</label>
      <label><input type="checkbox" id="opt-pedal" checked> Pédale</label>
      <label><input type="checkbox" id="opt-stretto"> Strette</label>
      <label><input type="checkbox" id="opt-cadence" checked> Cadence finale</label>
    </div>

    <div class="actions">
      <button class="primary" id="generate">Générer une fugue</button>
      <button class="secondary" id="play" disabled>Écouter</button>
      <span id="status"></span>
    </div>
  </section>

  <section id="result" hidden>
    <div id="structure"></div>
    <div id="score-wrap"><div id="score"></div></div>
  </section>
</main>

<footer>
  Rendu et lecture par <a href="https://www.abcjs.net/" style="color:inherit">abcjs</a>. Fonctionne hors-ligne une fois chargé.
</footer>

<script src="app.js"></script>
</body>
</html>
